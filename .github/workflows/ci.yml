name: IELTS Quiz App CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Run ESLint Code Quality Verification
        run: npm run lint

      - name: Execute Full Jest Test Suite
        run: npm test -- --coverage --ci
